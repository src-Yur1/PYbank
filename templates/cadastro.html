<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Cadastro - PyBank</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <main class="cadastro-container">

        <header class="cadastro-header">

            <div>
                <h1>PyBank</h1>
                <p>Sistema Bancário</p>
            </div>

        </header>


        <section class="cadastro-card">

            <h2>Crie suas contas</h2>

            <p>
                Preencha os dados das duas contas para começar.
            </p>


            <form action="/cadastrar" method="POST">


                <div class="conta-form">

                    <h3>Conta 1</h3>


                    <label for="titular1">
                        Nome do titular
                    </label>

                    <input
                        type="text"
                        id="titular1"
                        name="titular1"
                        placeholder="Digite o nome"
                        required
                    >


                    <label for="numero_conta1">
                        Número da conta
                    </label>

                    <input
                        type="text"
                        id="numero_conta1"
                        name="numero_conta1"
                        placeholder="Digite o número"
                        required
                    >


                    <label for="saldo1">
                        Saldo inicial
                    </label>

                    <input
                        type="number"
                        id="saldo1"
                        name="saldo1"
                        placeholder="0.00"
                        min="0"
                        step="0.01"
                        required
                    >

                </div>


                <div class="conta-form">

                    <h3>Conta 2</h3>


                    <label for="titular2">
                        Nome do titular
                    </label>

                    <input
                        type="text"
                        id="titular2"
                        name="titular2"
                        placeholder="Digite o nome"
                        required
                    >


                    <label for="numero_conta2">
                        Número da conta
                    </label>

                    <input
                        type="text"
                        id="numero_conta2"
                        name="numero_conta2"
                        placeholder="Digite o número"
                        required
                    >


                    <label for="saldo2">
                        Saldo inicial
                    </label>

                    <input
                        type="number"
                        id="saldo2"
                        name="saldo2"
                        placeholder="0.00"
                        min="0"
                        step="0.01"
                        required
                    >

                </div>


                <button type="submit">
                    Criar contas
                </button>

            </form>

        </section>

    </main>

</body>

</html>
